swagger: '2.0'
info:
  title: Q-S Media Manager Search
  description: >-
    Search Q-S Getty Media Manager assets for the Q-S Creative Asset Search
    agent.
  version: '1.0'
host: brandfolder.com
basePath: /api/v4
schemes:
  - https
consumes: []
produces: []
paths:
  /brandfolders:
    get:
      responses:
        default:
          description: default
          schema: {}
      summary: List Accessible Brandfolders
      description: >-
        Returns Brandfolders accessible to the authenticated Q-S Media Manager
        user.
      operationId: ListBrandfolders
      parameters: []
  /brandfolders/{brandfolder_id}/assets:
    get:
      responses:
        default:
          description: default
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: id
                    type:
                      type: string
                      description: type
                    attributes:
                      type: object
                      properties:
                        name:
                          type: string
                          description: name
                        description:
                          type: string
                          description: description
                        thumbnail_url:
                          type: string
                          description: thumbnail_url
                        approved:
                          type: boolean
                          description: approved
                        extension:
                          type: string
                          description: extension
                      description: attributes
                description: data
              meta:
                type: object
                properties:
                  current_page:
                    type: integer
                    format: int32
                    description: current_page
                  total_pages:
                    type: integer
                    format: int32
                    description: total_pages
                  total_count:
                    type: integer
                    format: int32
                    description: total_count
                description: meta
      summary: Search Q-S DAM Assets
      description: >-
        Search existing assets in the Quigley-Simpson Getty Media Manager
        library.
      operationId: SearchDAMAssetsV2
      parameters:
        - name: brandfolder_id
          in: path
          required: true
          type: string
          default: hwj47s9kcnvsqmrvk7xzhgtx
          x-ms-visibility: internal
          x-ms-summary: Library ID
          description: The Q-S Media Manager library ID.
        - name: search
          in: query
          required: true
          type: string
          x-ms-visibility: important
          x-ms-summary: Creative search query
          description: >-
            Search terms used to find matching existing assets in Q-S Media
            Manager.
        - name: page
          in: query
          required: false
          type: integer
          description: Page number used for Show More or Search Deeper
          x-ms-summary: Page
          x-ms-visibility: advanced
        - name: per
          in: query
          required: true
          type: integer
          default: 10
          description: Number of Media Manager assets returned per request.
          x-ms-visibility: internal
          x-ms-summary: Results per page
        - name: fields
          in: query
          required: true
          type: string
          default: extension
          description: Extra asset fields to return.
          x-ms-visibility: internal
          x-ms-summary: Fields
  /assets/{asset_id}:
    get:
      responses:
        default:
          description: default
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: string
                    description: id
                  type:
                    type: string
                    description: type
                  attributes:
                    type: object
                    properties:
                      name:
                        type: string
                        description: name
                      description:
                        type: string
                        description: description
                      thumbnail_url:
                        type: string
                        description: thumbnail_url
                      approved:
                        type: boolean
                        description: approved
                      extension:
                        type: string
                        description: extension
                    description: attributes
                description: data
      summary: Get Q-S Media Manager Asset by ID
      description: >-
        Look up one existing Q-S DAM asset by its Media Manager asset ID (a
        short letters-and-numbers ID like the ones shown on DAM result cards).
        Do not use for long numeric Getty Images stock IDs.
      operationId: GetMediaManagerAsset
      parameters:
        - name: asset_id
          in: path
          required: true
          type: string
          x-ms-visibility: important
          x-ms-summary: DAM asset ID
          description: The Q-S Media Manager asset ID.
        - name: fields
          in: query
          required: true
          type: string
          default: extension
          description: Extra asset fields to return.
          x-ms-visibility: internal
          x-ms-summary: Fields
definitions: {}
parameters: {}
responses: {}
security:
  - api_key: []
tags: []
securityDefinitions:
  api_key:
    type: apiKey
    in: header
    name: Authorization
